name: Fork Upstream Rebase

on:
  schedule:
    # Weekly, Monday 07:17 UTC. Also run manually after an upstream release.
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-upstream-rebase
  cancel-in-progress: false

jobs:
  prepare:
    name: Fast-forward tracking and prepare rebase candidate
    if: github.repository == 'HeartSprinkles/Eta' && github.ref == 'refs/heads/custom-main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      old_custom: ${{ steps.sync.outputs.old_custom }}
      new_tracking: ${{ steps.sync.outputs.new_tracking }}
      candidate_sha: ${{ steps.sync.outputs.candidate_sha }}
      candidate_branch: ${{ steps.sync.outputs.candidate_branch }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Preserve trusted orchestration before rebasing
        run: |
          cp scripts/fork/git_sync.py "$RUNNER_TEMP/git_sync.py"
          cp .github/fork-maintenance.json "$RUNNER_TEMP/fork-maintenance.json"
      - name: Fetch, fast-forward tracking and rebase only a disposable candidate
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/git_sync.py" prepare --config "$RUNNER_TEMP/fork-maintenance.json"

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/fork-validation.yml
    with:
      revision: ${{ needs.prepare.outputs.candidate_sha }}
    # No secrets are inherited; candidate code never runs with write permissions.

  promote:
    name: Back up and promote tested custom-main with exact lease
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out trusted controller, not the candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Promote only if both captured remote baselines are unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_CUSTOM: ${{ needs.prepare.outputs.old_custom }}
          NEW_TRACKING: ${{ needs.prepare.outputs.new_tracking }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
        run: python3 scripts/fork/git_sync.py promote --config .github/fork-maintenance.json
