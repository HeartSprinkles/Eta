name: Test Build

# 仅供测试分支使用：构建使用独立包名的 Debug 测试包，与原版共存安装。
on:
  push:
    branches:
      - test-build
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 单元测试与 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      # 测试包叠加 .debug 后缀，与原版并存安装；清单权限与 authority 由 applicationId 派生
      - name: 单元测试与 Debug 构建
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          "-Peta.buildMetadata=${GITHUB_SHA::7}"
          "-Peta.applicationIdSuffix=.debug"
          :app:testDebugUnitTest :app:assembleDebug

      - name: 校验测试包独立包名
        id: apk
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/Eta-v*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Debug APK 数量异常（${#apks[@]}）。"
            exit 1
          fi
          aapt2_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          package_name="$("$aapt2_path" dump badging "${apks[0]}" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          if [[ "$package_name" != "io.github.mangi.eta.debug" ]]; then
            echo "::error::测试包名不符合预期：$package_name"
            exit 1
          fi
          echo "测试包名：$package_name"
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"

      - name: 上传测试 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-test-debug-apk
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 7
